name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]" pip-audit
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest -q
      - run: pytest --cov=app --cov-report=term-missing -q tests/test_api.py tests/test_db_sqlite.py tests/test_ingestion.py
      - run: DATABASE_URL=sqlite:///${RUNNER_TEMP}/migration-test.db alembic upgrade head
      - run: pip-audit

  # Production runs Postgres + pgvector; everything above uses SQLite and an in-memory vector
  # store. This job runs the migrations and the vector SQL against the real thing.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: rag
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://rag:rag_password@localhost:5432/rag
      POSTGRES_TEST_URL: postgresql+psycopg://rag:rag_password@localhost:5432/rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: pytest -q tests/test_postgres_integration.py

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: enterprise-rag:test
