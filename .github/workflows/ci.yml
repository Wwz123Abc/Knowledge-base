name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]" pip-audit
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest -q
      - run: pytest --cov=app --cov-report=term-missing -q tests/test_api.py tests/test_db_sqlite.py tests/test_ingestion.py
      - run: DATABASE_URL=sqlite:///${RUNNER_TEMP}/migration-test.db alembic upgrade head
      - run: pip-audit

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: enterprise-rag:test
