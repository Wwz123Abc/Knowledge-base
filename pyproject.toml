[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-knowledge-rag"
version = "0.1.0"
description = "基于 LangChain 的企业知识库问答 MVP"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]==0.52.3",
  "python-multipart>=0.0.12,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "langchain-core>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "langchain-postgres>=0.0.16,<1.0",
  "langchain-text-splitters>=1.0,<2.0",
  "httpx>=0.28,<1.0",
  "python-docx>=1.1,<2.0",
  "alembic>=1.15,<2.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "prometheus-client>=0.21,<1.0",
  "redis>=5.2,<7.0",
  "celery[redis]>=5.5,<6.0",
  "langgraph>=1.0,<2.0",
  "pdfplumber>=0.11,<1.0",
  "PyMuPDF>=1.25,<2.0",
  "pytesseract>=0.3.13,<1.0",
  "Pillow>=11.0,<13.0",
  "sqlglot>=28.0,<30.0",
  "python-pptx>=1.0,<2.0",
  "fastembed>=0.7,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["backups"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
